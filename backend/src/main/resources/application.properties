spring.application.name=clinica-backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinica}
spring.datasource.username=${DB_USERNAME:clinica}
spring.datasource.password=${DB_PASSWORD:clinica}

# schema.sql / data.sql run on every startup; entities do not auto-generate
# the schema, so schema.sql is the single source of truth for table shape
# (keep it in sync with docs/DATA_MODEL.md).
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

clinica.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# PayMongo Sandbox Configuration
